<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zairyo Tensei - 1</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Georgia, "Times New Roman", serif;
}

/* Loading */

#loading {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 15px;
    color: #ccc;
    font-family: Arial, sans-serif;
}

.loader {
    width: 42px;
    height: 42px;
    border: 4px solid #333;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Error */

#error {
    display: none;
    max-width: 700px;
    margin: 100px auto;
    padding: 30px;
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 12px;
    font-family: Arial, sans-serif;
}

#error h2 {
    color: #ff7777;
}

#error code {
    display: block;
    margin-top: 15px;
    padding: 15px;
    background: #0a0a0a;
    border-radius: 8px;
    overflow-x: auto;
}

/* Reader */

#reader {
    display: none;
    max-width: 850px;
    margin: 0 auto;
    padding: 60px 35px 100px;
    line-height: 1.85;
}

#document {
    font-size: 19px;
}

#document p {
    margin: 0 0 1.2em;
    text-indent: 2em;
}

#document h1,
#document h2,
#document h3,
#document h4 {
    text-align: center;
    text-indent: 0;
    color: #fff;
}

#document h1 {
    font-size: 42px;
    margin: 80px 0 40px;
}

#document h2 {
    font-size: 34px;
    margin: 80px 0 35px;
}

#document h3 {
    font-size: 27px;
    margin: 60px 0 30px;
}

#document h4 {
    font-size: 23px;
    margin: 50px 0 25px;
}

#document ul,
#document ol {
    margin: 20px 0;
    padding-left: 2.5em;
}

#document li {
    margin-bottom: 8px;
}

#document blockquote {
    margin: 30px 20px;
    padding-left: 20px;
    border-left: 3px solid #555;
    color: #bbb;
    font-style: italic;
}

#document img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 30px auto;
}

#document a {
    color: #aaa;
}

/* Top bar */

#topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 46px;
    background: rgba(17,17,17,.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #292929;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    font-family: Arial, sans-serif;
    font-size: 13px;
}

#topbar .title {
    color: #ddd;
}

#topbar .status {
    color: #777;
}

/* Progress */

#progress {
    position: fixed;
    top: 45px;
    left: 0;
    height: 2px;
    width: 0;
    background: #eee;
    z-index: 1001;
}

/* Chapter button */

#chapterButton {
    position: fixed;
    right: 20px;
    bottom: 20px;

    width: 50px;
    height: 50px;

    border: 1px solid #444;
    border-radius: 50%;

    background: #1d1d1d;
    color: #eee;

    font-size: 21px;
    cursor: pointer;

    z-index: 1100;
}

#chapterButton:hover {
    background: #292929;
}

/* Chapter menu */

#chapterMenu {
    position: fixed;
    right: 20px;
    bottom: 82px;

    width: 300px;
    max-height: 65vh;

    background: #191919;
    border: 1px solid #333;
    border-radius: 12px;

    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);

    z-index: 1099;

    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;

    transition: .2s;
}

#chapterMenu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

#chapterTitle {
    padding: 15px;
    border-bottom: 1px solid #333;

    font-family: Arial, sans-serif;
    font-weight: bold;
}

#chapterList {
    max-height: calc(65vh - 50px);
    overflow-y: auto;
}

.chapterItem {
    display: block;
    width: 100%;

    padding: 13px 15px;

    border: 0;
    border-bottom: 1px solid #292929;

    background: transparent;
    color: #bbb;

    text-align: left;

    font-family: Arial, sans-serif;
    font-size: 13px;

    cursor: pointer;
}

.chapterItem:hover,
.chapterItem.current {
    background: #292929;
    color: #fff;
}

/* Mobile */

@media (max-width: 600px) {

    #reader {
        padding: 55px 20px 70px;
    }

    #document {
        font-size: 17px;
        line-height: 1.75;
    }

    #document h1 {
        font-size: 34px;
    }

    #document h2 {
        font-size: 29px;
    }

    #document h3 {
        font-size: 24px;
    }

    #document p {
        text-indent: 1.5em;
    }

    #topbar .status {
        display: none;
    }

    #chapterMenu {
        left: 10px;
        right: 10px;
        width: auto;
        bottom: 80px;
    }
}

/* Print */

@media print {

    #topbar,
    #loading,
    #error,
    #chapterButton,
    #chapterMenu,
    #progress {
        display: none !important;
    }

    #reader {
        display: block !important;
        max-width: none;
        padding: 0;
    }

    body {
        background: white;
        color: black;
    }

    #document h1,
    #document h2,
    #document h3,
    #document h4 {
        color: black;
    }
}
</style>
</head>

<body>

<div id="topbar">
    <div class="title">Zairyo Tensei — 1</div>
    <div class="status" id="status">Loading manuscript...</div>
</div>

<div id="progress"></div>

<div id="loading">
    <div class="loader"></div>
    <div>Loading Zairyo Tensei...</div>
</div>

<div id="error">
    <h2>Couldn't load the manuscript</h2>

    <p>
        The website couldn't download <b>Main.docx</b> from GitHub.
    </p>

    <p>
        Make sure the file is public and located at:
    </p>

    <code>
        vahinT/ZT/Main.docx
    </code>

    <p>
        Then refresh the page.
    </p>
</div>

<main id="reader">
    <article id="document"></article>
</main>

<button id="chapterButton" title="Chapters">☰</button>

<div id="chapterMenu">

    <div id="chapterTitle">
        Chapters
    </div>

    <div id="chapterList"></div>

</div>

<script>

const DOCX_URL =
    "https://raw.githubusercontent.com/vahinT/ZT/main/Main.docx";

const loading =
    document.getElementById("loading");

const reader =
    document.getElementById("reader");

const error =
    document.getElementById("error");

const documentContainer =
    document.getElementById("document");

const status =
    document.getElementById("status");

const chapterButton =
    document.getElementById("chapterButton");

const chapterMenu =
    document.getElementById("chapterMenu");

const chapterList =
    document.getElementById("chapterList");

const progress =
    document.getElementById("progress");


/* Open / close chapter menu */

chapterButton.onclick = () => {
    chapterMenu.classList.toggle("open");
};


/* Close menu when clicking elsewhere */

document.addEventListener("click", event => {

    if (
        !chapterMenu.contains(event.target) &&
        !chapterButton.contains(event.target)
    ) {
        chapterMenu.classList.remove("open");
    }

});


/* Detect chapters */

function createChapterList() {

    chapterList.innerHTML = "";

    const elements =
        documentContainer.querySelectorAll(
            "p, h1, h2, h3, h4"
        );

    const numberWords = [
        "one", "two", "three", "four", "five",
        "six", "seven", "eight", "nine", "ten",
        "eleven", "twelve", "thirteen", "fourteen",
        "fifteen", "sixteen", "seventeen", "eighteen",
        "nineteen", "twenty"
    ];

    const chapters = [];

    elements.forEach((element, index) => {

        const text =
            element.textContent.trim();

        const match =
            text.match(/^chapter\s+([a-z]+|\d+)$/i);

        if (!match) return;

        const number =
            match[1].toLowerCase();

        if (
            !numberWords.includes(number) &&
            !/^\d+$/.test(number)
        ) {
            return;
        }

        /*
         * Look for the title immediately after
         * "Chapter Three".
         */

        let title = "";

        let next = element.nextElementSibling;

        if (next) {

            const nextText =
                next.textContent.trim();

            /*
             * Don't accidentally use another chapter
             * as the title.
             */

            if (
                nextText &&
                !/^chapter\s+([a-z]+|\d+)$/i.test(nextText)
            ) {
                title = nextText;
            }
        }

        chapters.push({
            element: element,
            chapter: text,
            title: title
        });

    });


    if (chapters.length === 0) {

        chapterList.innerHTML =
            '<div style="padding:16px;color:#777;font-family:Arial">' +
            'No chapter headings were found.' +
            '</div>';

        return;
    }


    chapters.forEach((chapter, index) => {

        const id =
            "chapter-" + (index + 1);

        chapter.element.id = id;

        const button =
            document.createElement("button");

        button.className =
            "chapterItem";

        button.textContent =
            chapter.title
                ? chapter.chapter + " — " + chapter.title
                : chapter.chapter;

        button.onclick = () => {

            chapter.element.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

            chapterMenu.classList.remove("open");

        };

        chapterList.appendChild(button);

    });


    window.chapterElements =
        chapters;

}


/* Update current chapter */

function updateCurrentChapter() {

    if (!window.chapterElements) return;

    let current = 0;

    window.chapterElements.forEach(
        (chapter, index) => {

            if (
                chapter.element.getBoundingClientRect().top
                <= 120
            ) {
                current = index;
            }

        }
    );

    const buttons =
        chapterList.querySelectorAll(".chapterItem");

    buttons.forEach((button, index) => {

        button.classList.toggle(
            "current",
            index === current
        );

    });

}


/* Reading progress */

function updateProgress() {

    const total =
        document.documentElement.scrollHeight -
        window.innerHeight;

    const percent =
        total > 0
            ? (window.scrollY / total) * 100
            : 0;

    progress.style.width =
        Math.min(100, percent) + "%";

}


/* Save reading position */

let saveTimer;

window.addEventListener("scroll", () => {

    updateProgress();
    updateCurrentChapter();

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {

        localStorage.setItem(
            "zairyoReadingPosition",
            window.scrollY
        );

    }, 300);

});


/* Load saved reading position */

function restorePosition() {

    const saved =
        localStorage.getItem(
            "zairyoReadingPosition"
        );

    if (saved !== null) {

        setTimeout(() => {

            window.scrollTo(
                0,
                Number(saved)
            );

        }, 200);

    }

}


/* Load DOCX */

async function loadDocument() {

    try {

        const url =
            DOCX_URL + "?v=" + Date.now();

        status.textContent =
            "Downloading manuscript...";

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "GitHub returned HTTP " +
                response.status
            );

        }

        status.textContent =
            "Converting manuscript...";

        const arrayBuffer =
            await response.arrayBuffer();

        const result =
            await mammoth.convertToHtml(
                {
                    arrayBuffer: arrayBuffer
                },
                {
                    styleMap: [
                        "p[style-name='Title'] => h1:fresh",
                        "p[style-name='Heading 1'] => h1:fresh",
                        "p[style-name='Heading 2'] => h2:fresh",
                        "p[style-name='Heading 3'] => h3:fresh",
                        "p[style-name='Heading 4'] => h4:fresh"
                    ]
                }
            );

        documentContainer.innerHTML =
            result.value;

        createChapterList();

        loading.style.display =
            "none";

        reader.style.display =
            "block";

        status.textContent =
            "Manuscript loaded";

        restorePosition();

        updateProgress();
        updateCurrentChapter();

        if (
            result.messages &&
            result.messages.length
        ) {

            console.warn(
                "Mammoth messages:",
                result.messages
            );

        }

    } catch (err) {

        console.error(
            "Failed to load DOCX:",
            err
        );

        loading.style.display =
            "none";

        reader.style.display =
            "none";

        error.style.display =
            "block";

        status.textContent =
            "Failed to load";

    }

}

loadDocument();

</script>

</body>
</html>
